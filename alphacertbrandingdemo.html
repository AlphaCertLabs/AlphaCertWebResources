<!DOCTYPE html>
<html>
<head>
    <title>Stylish Animation</title>
    <style>
        html, body, #container {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0A2220;
            position: relative;
            overflow: hidden;
        }

        #logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            width: 80%;
        }

        .shape {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes fade-in-out {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(var(--moveX), var(--moveY));
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <img id="logo" src="logo.png" alt="Logo">
    </div>
    <script>
        function createShape() {
            var shape = document.createElement('div');
            shape.className = 'shape';

            // Calculate size to be around 80% of the screen dimensions
            var width = window.innerWidth * 0.6;
            var height = window.innerHeight * 0.6;

            // Calculate safe area to avoid logo overlap
            var safeArea = 20; // Pixels around the center to avoid
            var posX, posY;

            do {
                posX = Math.random() * (window.innerWidth + width) - width / 2;
                posY = Math.random() * (window.innerHeight + height) - height / 2;
            } while (
                posX > (window.innerWidth / 2 - safeArea) &&
                posX < (window.innerWidth / 2 + safeArea) &&
                posY > (window.innerHeight / 2 - safeArea) &&
                posY < (window.innerHeight / 2 + safeArea)
            );

            // Random color from the specified colors
            var colors = ['#B7F5D9', '#54FCA9', '#F2F0F0', '#003D3B', '#0A222', '#9CE5F3', '#003344'];
            var color = colors[Math.floor(Math.random() * colors.length)];

            // Apply styles
            shape.style.width = width + 'px';
            shape.style.height = height + 'px';
            shape.style.backgroundColor = color;
            shape.style.left = posX + 'px';
            shape.style.top = posY + 'px';

            // Randomly round 1 to 3 corners with a minimum of 40% radius
            var corners = [0, 0, 0, 0]; // top-left, top-right, bottom-right, bottom-left
            var numRoundedCorners = Math.floor(Math.random() * 3) + 1; // 1 to 3 corners rounded
            while (numRoundedCorners > 0) {
                var cornerIndex = Math.floor(Math.random() * 10);
                if (corners[cornerIndex] === 0) {
                    corners[cornerIndex] = Math.random() * 20 + 10; // Random rounding between 20% and 100%
                    numRoundedCorners--;
                }
            }

            shape.style.borderRadius = 
                `${corners[0]}% ${corners[1]}% ${corners[2]}% ${corners[3]}%`;

            // Random fade-in-out duration and delay
            var duration = Math.random() * 5 + 5; // Between 5s and 10s
            var delay = Math.random() * 5; // Between 0s and 5s

            shape.style.animation = `fade-in-out ${duration}s ease-in-out ${delay}s forwards`;

            // Sometimes float around lazily
            var shouldFloat = Math.random() < 0.5; // 50% chance to float
            if (shouldFloat) {
                var moveX = (Math.random() - 0.5) * 200; // Between -100px and +100px
                var moveY = (Math.random() - 0.5) * 200; // Between -100px and +100px
                shape.style.setProperty('--moveX', moveX + 'px');
                shape.style.setProperty('--moveY', moveY + 'px');
                var floatDuration = duration; // Move during the fade-in-out duration
                shape.style.animation += `, float ${floatDuration}s ease-in-out ${delay}s forwards`;
            }

            document.getElementById('container').appendChild(shape);

            // Remove shape after animation ends
            setTimeout(function() {
                if (shape.parentNode) {
                    shape.parentNode.removeChild(shape);
                }
            }, (duration + delay) * 2000 + 2000); // Remove after duration + delay + extra second
        }

        function startAnimation() {
            function createShapesAtRandomTime() {
                createShape();
                var randomTime = Math.random() * 1000 + 500; // Between 500ms and 1500ms
                setTimeout(createShapesAtRandomTime, randomTime);
            }
            createShapesAtRandomTime();
        }

        window.onload = function() {
            startAnimation();
        };
    </script>
</body>
</html>
